name: Performance

# Generates the baseline profile and runs the startup and scroll benchmarks on an emulator
# (a Gradle Managed Device). Slow (about 30 minutes), so it runs on demand and when the
# benchmarks themselves change, not on every pull request.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "baselineprofile/**"
      - ".github/workflows/performance.yml"

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Lets the job commit a freshly generated baseline profile to the pull request branch.
  contents: write

jobs:
  benchmarks:
    name: Baseline profile and benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch itself (not the merge commit), so the profile can be committed back to it.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Generate baseline profile
        run: >
          ./gradlew :app:generateReleaseBaselineProfile
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.experimental.testOptions.managedDevices.emulator.showKernelLogging=true
          --no-configuration-cache

      - name: Commit the baseline profile to the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/release/generated/baselineProfiles
          if git diff --cached --quiet; then
            echo "Baseline profile unchanged"
          else
            git commit -m "Update baseline profile"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Run startup and scroll benchmarks
        run: >
          ./gradlew :baselineprofile:pixel6Api34BenchmarkReleaseAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark
          --no-configuration-cache

      - name: Summarise results
        if: always()
        run: |
          # Printed to the log as well as the job summary, so the numbers can be read from the log.
          python3 .github/scripts/benchmark_summary.py baselineprofile/build | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Upload baseline profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profile
          path: app/src/release/generated/baselineProfiles/
          if-no-files-found: warn

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            baselineprofile/build/outputs/
            baselineprofile/build/reports/
          if-no-files-found: warn
