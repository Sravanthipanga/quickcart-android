// Classes the Compose compiler can't prove stable on its own, but that are in practice.
// See https://developer.android.com/develop/ui/compose/performance/stability/fix

// Domain models: Kotlin data classes with only `val`s, compiled without the Compose compiler.
com.sravanthi.quickcart.core.model.*

// java.time values are immutable.
java.time.*

// Read-only collections. QuickCart never mutates a list after putting it in UI state.
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map
